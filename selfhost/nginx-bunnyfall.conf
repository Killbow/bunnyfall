# BUNNYFALL behind a box's own nginx (a game panel's): copy to /etc/nginx/conf.d/bunnyfall.conf, then
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d dagg.campfirerp.com
# The game's web container listens on 127.0.0.1:8480 (WEB_HTTP in .env, DOMAIN=:80).
map $http_upgrade $bunnyfall_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name dagg.campfirerp.com;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8480;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bunnyfall_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
