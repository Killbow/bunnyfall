# BUNNYFALL: the whole server. `docker compose up -d --build` on the Linux box.
# Needs: DNS A record dagg.campfirerp.com -> your public IP, router forwarding TCP 80 and 443 (and UDP 443) to this box.
services:
  server:
    build:
      context: .
      dockerfile: selfhost/Dockerfile
      target: server
    restart: unless-stopped
    # BUNNYFALL: a ceiling, so the game server can never take the whole box down with it (the box stays reachable
    # over SSH and docker keeps answering, whatever the server does)
    mem_limit: 3g
    cpus: "2.0"
    volumes:
      - ./data:/data
      - ./updates:/updates   # the owner's update button leaves its request here for the host's cron

  web:
    build:
      context: .
      dockerfile: selfhost/Dockerfile
      target: web
    restart: unless-stopped
    mem_limit: 256m
    cpus: "1.0"
    depends_on:
      - server
    environment:
      DOMAIN: ${DOMAIN:-dagg.campfirerp.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
